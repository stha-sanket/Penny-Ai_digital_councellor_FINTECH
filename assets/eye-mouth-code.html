<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #000100;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .face {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 50px;
    }

    .eyes {
      display: flex;
      gap: 140px;
    }

    .mouth {
      width: 80px;
      height: 24px;
      background: #1eff00;
      clip-path: polygon(
        0% 0%, 100% 0%,
        100% 50%, 75% 50%,
        75% 100%, 25% 100%,
        25% 50%, 0% 50%
      );
      filter: drop-shadow(0 0 18px #29B6FF);
    }

    .eye {
      width: 300px;
      height: 300px;
      background: #1eff00;

      clip-path: polygon(
        35% 0%,
        65% 0%,
        65% 5%,
        75% 5%,
        75% 10%,
        85% 10%,
        85% 15%,
        90% 15%,
        90% 25%,
        95% 25%,
        95% 35%,
        100% 35%,
        100% 65%,
        95% 65%,
        95% 75%,
        90% 75%,
        90% 85%,
        85% 85%,
        85% 90%,
        75% 90%,
        75% 95%,
        65% 95%,
        65% 100%,
        35% 100%,
        35% 95%,
        25% 95%,
        25% 90%,
        15% 90%,
        15% 85%,
        10% 85%,
        10% 75%,
        5% 75%,
        5% 65%,
        0% 65%,
        0% 35%,
        5% 35%,
        5% 25%,
        10% 25%,
        10% 15%,
        15% 15%,
        15% 10%,
        25% 10%,
        25% 5%,
        35% 5%
      );

      filter: drop-shadow(0 0 18px #29B6FF);

      animation: blink 4s infinite;
      transform-origin: center;
    }

    @keyframes blink {
      0%, 90%, 100% {
        transform: scaleY(1);
      }

      93%, 97% {
        transform: scaleY(0.06);
      }
    }
  </style>
</head>

<body>

  <div class="face">
    <div class="eyes">
      <div class="eye"></div>
      <div class="eye"></div>
    </div>
    <div class="mouth"></div>
  </div>

</body>
</html>
