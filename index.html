<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penny — Face</title>
  <meta name="description" content="Penny AI digital counsellor — live face display.">
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --green: #1eff00;
      --green-dim: #0a8a00;
      --green-glow: rgba(30, 255, 0, 0.3);
      --blue-glow: #29B6FF;
      --bg: #000100;
    }

    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: none;
    }

    /* ─── Scanline overlay ─── */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: repeating-linear-gradient(0deg,
          transparent,
          transparent 2px,
          rgba(0, 0, 0, 0.08) 2px,
          rgba(0, 0, 0, 0.08) 4px);
      pointer-events: none;
      z-index: 9999;
    }

    /* ─── Grid Background ─── */
    .grid-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image:
        linear-gradient(rgba(30, 255, 0, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30, 255, 0, 0.025) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    /* ─── Floating particles ─── */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: var(--green);
      border-radius: 50%;
      opacity: 0;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(100vh) scale(0.5); }
      10% { opacity: 0.5; }
      90% { opacity: 0.2; }
      100% { opacity: 0; transform: translateY(-10vh) scale(1.2); }
    }

    /* ─── Robot Face ─── */
    .robot-container {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .face {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 50px;
      transition: transform 0.3s ease;
    }

    /* ── Listening state ── */
    .face.listening {
      transform: scale(1.04);
    }

    .face.listening .eye {
      background: #00e5ff;
      filter: drop-shadow(0 0 35px rgba(0, 229, 255, 0.7));
    }

    .face.listening .mouth {
      background: #00e5ff;
      filter: drop-shadow(0 0 24px rgba(0, 229, 255, 0.6));
    }

    /* ── Speaking / Happy state ── */
    .face.happy .eye {
      clip-path: polygon(0% 75%, 0% 50%, 10% 50%, 10% 35%, 25% 35%, 25% 20%, 35% 20%, 35% 10%,
          65% 10%, 65% 20%, 75% 20%, 75% 35%, 90% 35%, 90% 50%, 100% 50%, 100% 75%,
          85% 75%, 85% 60%, 75% 60%, 75% 45%, 60% 45%, 60% 35%, 40% 35%, 40% 45%,
          25% 45%, 25% 60%, 15% 60%, 15% 75%);
    }

    /* ─── Eyes ─── */
    .eyes {
      display: flex;
      gap: 120px;
    }

    .eye {
      width: 220px;
      height: 220px;
      background: var(--green);
      clip-path: polygon(35% 0%, 65% 0%, 65% 5%, 75% 5%, 75% 10%, 85% 10%, 85% 15%, 90% 15%,
          90% 25%, 95% 25%, 95% 35%, 100% 35%, 100% 65%, 95% 65%, 95% 75%,
          90% 75%, 90% 85%, 85% 85%, 85% 90%, 75% 90%, 75% 95%, 65% 95%,
          65% 100%, 35% 100%, 35% 95%, 25% 95%, 25% 90%, 15% 90%, 15% 85%,
          10% 85%, 10% 75%, 5% 75%, 5% 65%, 0% 65%, 0% 35%, 5% 35%, 5% 25%,
          10% 25%, 10% 15%, 15% 15%, 15% 10%, 25% 10%, 25% 5%, 35% 5%);
      filter: drop-shadow(0 0 28px var(--blue-glow));
      animation: blink 4s infinite;
      transform-origin: center;
      transition: background 0.3s ease, filter 0.3s ease, clip-path 0.3s ease;
    }

    @keyframes blink {
      0%, 90%, 100% { transform: scaleY(1); }
      93%, 97% { transform: scaleY(0.06); }
    }

    /* ─── Mouth ─── */
    .mouth {
      width: 70px;
      height: 22px;
      background: var(--green);
      clip-path: polygon(0% 0%, 100% 0%, 100% 50%, 75% 50%,
          75% 100%, 25% 100%, 25% 50%, 0% 50%);
      filter: drop-shadow(0 0 18px var(--blue-glow));
      transition: all 0.15s ease;
    }

    .mouth.talking {
      animation: talk 0.25s infinite alternate ease-in-out;
    }

    @keyframes talk {
      0% { height: 14px; width: 54px; }
      50% { height: 40px; width: 80px; }
      100% { height: 28px; width: 64px; }
    }

    /* ─── Ambient glow ─── */
    .ambient-glow {
      position: absolute;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, var(--green-glow) 0%, rgba(30, 255, 0, 0.04) 40%, transparent 70%);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0.4;
      transition: all 0.5s ease;
    }

    /* Glow changes with state */
    .ambient-glow.listening {
      opacity: 0.7;
      background: radial-gradient(circle, rgba(0, 229, 255, 0.25) 0%, rgba(0, 229, 255, 0.05) 40%, transparent 70%);
    }

    .ambient-glow.speaking {
      opacity: 0.65;
      background: radial-gradient(circle, var(--green-glow) 0%, rgba(30, 255, 0, 0.08) 40%, transparent 70%);
      animation: speakGlow 1s ease-in-out infinite alternate;
    }

    @keyframes speakGlow {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
      100% { transform: translate(-50%, -50%) scale(1.08); opacity: 0.7; }
    }

    .ambient-glow.thinking {
      opacity: 0.5;
      background: radial-gradient(circle, rgba(255, 200, 0, 0.15) 0%, rgba(255, 200, 0, 0.03) 40%, transparent 70%);
      animation: thinkPulse 1.5s ease-in-out infinite;
    }

    @keyframes thinkPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.4; }
      50% { transform: translate(-50%, -50%) scale(1.04); opacity: 0.6; }
    }

    /* ─── Responsive ─── */
    @media (max-width: 768px) {
      .eye { width: 150px; height: 150px; }
      .eyes { gap: 70px; }
      .face { gap: 35px; }
      .mouth { width: 50px; height: 16px; }
      .ambient-glow { width: 450px; height: 450px; }
    }

    @media (max-width: 480px) {
      .eye { width: 110px; height: 110px; }
      .eyes { gap: 50px; }
      .face { gap: 24px; }
      .mouth { width: 40px; height: 12px; }
      .ambient-glow { width: 320px; height: 320px; }
    }
  </style>
</head>

<body>

  <!-- Grid background -->
  <div class="grid-bg"></div>

  <!-- Floating particles -->
  <div class="particles" id="particles"></div>

  <!-- Robot Face -->
  <div class="robot-container">
    <div class="face" id="robotFace">
      <div class="eyes">
        <div class="eye"></div>
        <div class="eye"></div>
      </div>
      <div class="mouth" id="robotMouth"></div>
    </div>
    <div class="ambient-glow" id="ambientGlow"></div>
  </div>

  <script>
    // ─── DOM ───
    const face = document.getElementById('robotFace');
    const mouth = document.getElementById('robotMouth');
    const glow = document.getElementById('ambientGlow');
    const particlesContainer = document.getElementById('particles');

    // ─── BroadcastChannel — listen for state from chat page ───
    const channel = new BroadcastChannel('penny-state');

    channel.onmessage = (event) => {
      const { state } = event.data;

      // Clear all states first
      face.classList.remove('listening', 'happy');
      mouth.classList.remove('talking');
      glow.classList.remove('listening', 'speaking', 'thinking');

      switch (state) {
        case 'listening':
          face.classList.add('listening');
          glow.classList.add('listening');
          break;

        case 'thinking':
          glow.classList.add('thinking');
          break;

        case 'speaking':
          face.classList.add('happy');
          mouth.classList.add('talking');
          glow.classList.add('speaking');
          break;

        case 'idle':
        default:
          // All cleared above — back to default
          break;
      }
    };

    // ─── Floating Particles ───
    function createParticle() {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animationDuration = (10 + Math.random() * 15) + 's';
      particle.style.animationDelay = Math.random() * 5 + 's';
      const size = (2 + Math.random() * 2) + 'px';
      particle.style.width = size;
      particle.style.height = size;
      particle.style.opacity = 0;

      if (Math.random() > 0.7) {
        particle.style.background = '#00e5ff';
      }

      particlesContainer.appendChild(particle);
      setTimeout(() => particle.remove(), 25000);
    }

    setInterval(createParticle, 800);
    for (let i = 0; i < 12; i++) {
      setTimeout(createParticle, i * 250);
    }

    // ─── Subtle mouse-follow on eyes ───
    document.addEventListener('mousemove', (e) => {
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      const dx = (e.clientX - cx) / cx;
      const dy = (e.clientY - cy) / cy;
      face.style.transform = `translate(${dx * 8}px, ${dy * 5}px)`;
    });
  </script>

</body>

</html>
