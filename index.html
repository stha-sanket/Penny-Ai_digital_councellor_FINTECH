<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #000;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 80px;
    }

    .eyes {
      display: flex;
      gap: 140px;
    }

    /* Pixelated circle eye */
    .eye {
      width: 180px;
      height: 180px;
      background: #008cff;

      clip-path: polygon(
        30% 0%,
        70% 0%,
        70% 5%,
        85% 5%,
        85% 15%,
        95% 15%,
        95% 30%,
        100% 30%,
        100% 70%,
        95% 70%,
        95% 85%,
        85% 85%,
        85% 95%,
        70% 95%,
        70% 100%,
        30% 100%,
        30% 95%,
        15% 95%,
        15% 85%,
        5% 85%,
        5% 70%,
        0% 70%,
        0% 30%,
        5% 30%,
        5% 15%,
        15% 15%,
        15% 5%,
        30% 5%
      );

      filter: drop-shadow(0 0 15px #008cff);

      animation: blink 4s infinite;
      transform-origin: center;
    }

    @keyframes blink {
      0%, 90%, 100% {
        transform: scaleY(1);
      }

      93%, 97% {
        transform: scaleY(0.06);
      }
    }

    /* Simple pixel-style smile */
    .mouth {
      width: 320px;
      height: 70px;

      border-left: 10px solid #008cff;
      border-right: 10px solid #008cff;
      border-bottom: 10px solid #008cff;

      filter: drop-shadow(0 0 15px #008cff);
    }
  </style>
</head>

<body>

  <div class="eyes">
    <div class="eye"></div>
    <div class="eye"></div>
  </div>

  <div class="mouth"></div>

</body>
</html>
