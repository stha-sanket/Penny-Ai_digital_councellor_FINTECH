<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penny — AI Voice Assistant</title>
  <meta name="description"
    content="Penny is your AI digital counsellor. Speak to Penny and get intelligent responses powered by local LLM.">
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --green: #1eff00;
      --green-dim: #0a8a00;
      --green-glow: rgba(30, 255, 0, 0.3);
      --blue-glow: #29B6FF;
      --bg: #000100;
      --surface: rgba(30, 255, 0, 0.04);
      --surface-hover: rgba(30, 255, 0, 0.08);
      --border: rgba(30, 255, 0, 0.12);
      --text: #c8ffc0;
      --text-dim: rgba(200, 255, 192, 0.5);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      font-family: 'Outfit', sans-serif;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* ─── Scanline overlay ─── */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: repeating-linear-gradient(0deg,
          transparent,
          transparent 2px,
          rgba(0, 0, 0, 0.08) 2px,
          rgba(0, 0, 0, 0.08) 4px);
      pointer-events: none;
      z-index: 9999;
    }

    /* ─── Robot Face ─── */
    .robot-container {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .face {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      transition: transform 0.3s ease;
    }

    .face.listening {
      transform: scale(1.02);
    }

    .eyes {
      display: flex;
      gap: 80px;
    }

    .eye {
      width: 140px;
      height: 140px;
      background: var(--green);
      clip-path: polygon(35% 0%, 65% 0%, 65% 5%, 75% 5%, 75% 10%, 85% 10%, 85% 15%, 90% 15%,
          90% 25%, 95% 25%, 95% 35%, 100% 35%, 100% 65%, 95% 65%, 95% 75%,
          90% 75%, 90% 85%, 85% 85%, 85% 90%, 75% 90%, 75% 95%, 65% 95%,
          65% 100%, 35% 100%, 35% 95%, 25% 95%, 25% 90%, 15% 90%, 15% 85%,
          10% 85%, 10% 75%, 5% 75%, 5% 65%, 0% 65%, 0% 35%, 5% 35%, 5% 25%,
          10% 25%, 10% 15%, 15% 15%, 15% 10%, 25% 10%, 25% 5%, 35% 5%);
      filter: drop-shadow(0 0 18px var(--blue-glow));
      animation: blink 4s infinite;
      transform-origin: center;
      transition: background 0.3s ease;
    }

    .face.listening .eye {
      background: #00e5ff;
      filter: drop-shadow(0 0 24px rgba(0, 229, 255, 0.6));
    }

    .face.happy .eye {
      clip-path: polygon(0% 75%, 0% 50%, 10% 50%, 10% 35%, 25% 35%, 25% 20%, 35% 20%, 35% 10%,
          65% 10%, 65% 20%, 75% 20%, 75% 35%, 90% 35%, 90% 50%, 100% 50%, 100% 75%,
          85% 75%, 85% 60%, 75% 60%, 75% 45%, 60% 45%, 60% 35%, 40% 35%, 40% 45%,
          25% 45%, 25% 60%, 15% 60%, 15% 75%);
    }

    @keyframes blink {

      0%,
      90%,
      100% {
        transform: scaleY(1);
      }

      93%,
      97% {
        transform: scaleY(0.06);
      }
    }

    .mouth {
      width: 50px;
      height: 16px;
      background: var(--green);
      clip-path: polygon(0% 0%, 100% 0%, 100% 50%, 75% 50%,
          75% 100%, 25% 100%, 25% 50%, 0% 50%);
      filter: drop-shadow(0 0 12px var(--blue-glow));
      transition: all 0.1s ease;
    }

    .mouth.talking {
      animation: talk 0.25s infinite alternate ease-in-out;
    }

    @keyframes talk {
      0% {
        height: 10px;
        width: 40px;
      }

      50% {
        height: 28px;
        width: 55px;
      }

      100% {
        height: 20px;
        width: 48px;
      }
    }

    .face.listening .mouth {
      background: #00e5ff;
      filter: drop-shadow(0 0 16px rgba(0, 229, 255, 0.5));
    }

    /* ─── Status Indicator ─── */
    .status {
      margin-top: 20px;
      font-size: 0.85rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-dim);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      min-height: 20px;
      transition: color 0.3s ease;
    }

    .status.active {
      color: #00e5ff;
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
    }

    .status.speaking {
      color: var(--green);
      text-shadow: 0 0 10px var(--green-glow);
    }

    /* ─── Chat Area ─── */
    .chat-section {
      width: 100%;
      max-width: 680px;
      padding: 0 20px;
      margin-top: 30px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .chat-messages {
      flex: 1;
      max-height: 300px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px 0;
      scrollbar-width: thin;
      scrollbar-color: var(--green-dim) transparent;
    }

    .chat-messages::-webkit-scrollbar {
      width: 4px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: var(--green-dim);
      border-radius: 4px;
    }

    .message {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.92rem;
      line-height: 1.6;
      max-width: 85%;
      animation: fadeIn 0.35s ease;
      word-wrap: break-word;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      align-self: flex-end;
      background: rgba(0, 229, 255, 0.1);
      border: 1px solid rgba(0, 229, 255, 0.2);
      color: #b0f0ff;
      border-radius: 12px 12px 4px 12px;
    }

    .message.bot {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px 12px 12px 4px;
    }

    .message .label {
      font-size: 0.7rem;
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 4px;
      opacity: 0.5;
    }

    .message.bot .typing-dots::after {
      content: '';
      animation: dots 1.4s infinite;
    }

    @keyframes dots {

      0%,
      20% {
        content: '.';
      }

      40% {
        content: '..';
      }

      60%,
      100% {
        content: '...';
      }
    }

    /* ─── Controls ─── */
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 20px 0 30px;
    }

    .mic-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid var(--green-dim);
      background: var(--surface);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      position: relative;
      flex-shrink: 0;
    }

    .mic-btn:hover {
      background: var(--surface-hover);
      border-color: var(--green);
      box-shadow: 0 0 20px var(--green-glow);
    }

    .mic-btn.recording {
      border-color: #ff4444;
      background: rgba(255, 68, 68, 0.1);
      box-shadow: 0 0 25px rgba(255, 68, 68, 0.3);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        box-shadow: 0 0 15px rgba(255, 68, 68, 0.2);
      }

      50% {
        box-shadow: 0 0 30px rgba(255, 68, 68, 0.5);
      }
    }

    .mic-btn svg {
      width: 24px;
      height: 24px;
      fill: var(--green);
      transition: fill 0.3s ease;
    }

    .mic-btn.recording svg {
      fill: #ff4444;
    }

    .text-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .text-input:focus {
      border-color: var(--green);
      box-shadow: 0 0 12px var(--green-glow);
    }

    .text-input::placeholder {
      color: var(--text-dim);
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      flex-shrink: 0;
    }

    .send-btn:hover {
      background: var(--surface-hover);
      border-color: var(--green);
      box-shadow: 0 0 12px var(--green-glow);
    }

    .send-btn svg {
      width: 18px;
      height: 18px;
      fill: var(--green);
    }

    /* ─── Ambient glow behind face ─── */
    .ambient-glow {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, var(--green-glow) 0%, transparent 70%);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0.4;
      transition: opacity 0.5s ease;
    }

    .face.listening~.ambient-glow,
    .robot-container:has(.face.listening) .ambient-glow {
      opacity: 0.7;
      background: radial-gradient(circle, rgba(0, 229, 255, 0.2) 0%, transparent 70%);
    }

    /* ─── Responsive ─── */
    @media (max-width: 600px) {
      .eye {
        width: 100px;
        height: 100px;
      }

      .eyes {
        gap: 50px;
      }

      .face {
        gap: 20px;
      }

      .mouth {
        width: 36px;
        height: 12px;
      }

      .chat-messages {
        max-height: 220px;
      }
    }
  </style>
</head>

<body>

  <!-- Robot Face -->
  <div class="robot-container">
    <div class="face" id="robotFace">
      <div class="eyes">
        <div class="eye"></div>
        <div class="eye"></div>
      </div>
      <div class="mouth" id="robotMouth"></div>
    </div>
    <div class="ambient-glow"></div>
  </div>

  <!-- Status -->
  <div class="status" id="statusText">tap the mic or type to talk</div>

  <!-- Chat Messages -->
  <div class="chat-section">
    <div class="chat-messages" id="chatMessages"></div>

    <!-- Controls -->
    <div class="controls">
      <button class="mic-btn" id="micBtn" title="Hold to speak">
        <svg viewBox="0 0 24 24">
          <path
            d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z" />
          <path
            d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" />
        </svg>
      </button>
      <input type="text" class="text-input" id="textInput" placeholder="Or type your message here..."
        autocomplete="off">
      <button class="send-btn" id="sendBtn" title="Send message">
        <svg viewBox="0 0 24 24">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
        </svg>
      </button>
    </div>
  </div>

  <script>
    // ─── Config ───
    const OLLAMA_URL = 'http://localhost:11434/api/chat';
    const MODEL = 'gemma4:e2b';

    // ─── DOM ───
    const face = document.getElementById('robotFace');
    const mouth = document.getElementById('robotMouth');
    const statusText = document.getElementById('statusText');
    const chatMessages = document.getElementById('chatMessages');
    const micBtn = document.getElementById('micBtn');
    const textInput = document.getElementById('textInput');
    const sendBtn = document.getElementById('sendBtn');

    // ─── State ───
    let isListening = false;
    let isSpeaking = false;
    let isProcessing = false;
    let recognition = null;

    // ─── Speech Recognition Setup ───
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isListening = true;
        face.classList.add('listening');
        micBtn.classList.add('recording');
        setStatus('listening...', 'active');
      };

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }

        if (event.results[event.results.length - 1].isFinal) {
          stopListening();
          if (transcript.trim()) {
            handleUserMessage(transcript.trim());
          }
        } else {
          setStatus(`hearing: "${transcript}"`, 'active');
        }
      };

      recognition.onerror = (event) => {
        console.error('Speech error:', event.error);
        stopListening();
        if (event.error === 'no-speech') {
          setStatus("i didn't hear anything — try again", '');
        } else if (event.error === 'not-allowed') {
          setStatus('microphone access denied', '');
        } else {
          setStatus('speech error — try again', '');
        }
      };

      recognition.onend = () => {
        stopListening();
      };
    }

    // ─── Mic Button ───
    micBtn.addEventListener('click', () => {
      if (isProcessing || isSpeaking) return;

      if (isListening) {
        recognition.stop();
      } else {
        startListening();
      }
    });

    // ─── Text Input ───
    textInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendTextMessage();
      }
    });

    sendBtn.addEventListener('click', sendTextMessage);

    function sendTextMessage() {
      const text = textInput.value.trim();
      if (!text || isProcessing || isSpeaking) return;
      textInput.value = '';
      handleUserMessage(text);
    }

    // ─── Listening Controls ───
    function startListening() {
      if (!recognition) {
        setStatus('speech recognition not supported in this browser', '');
        return;
      }
      // Stop any ongoing speech
      synthesis.cancel();
      isSpeaking = false;
      mouth.classList.remove('talking');
      face.classList.remove('happy');

      try {
        recognition.start();
      } catch (e) {
        console.error('Could not start recognition:', e);
      }
    }

    function stopListening() {
      isListening = false;
      face.classList.remove('listening');
      micBtn.classList.remove('recording');
    }

    // ─── Handle User Message ───
    async function handleUserMessage(text) {
      addMessage(text, 'user');
      setStatus('thinking...', 'active');
      isProcessing = true;

      // Add "thinking" bubble
      const thinkingEl = addMessage('', 'bot', true);

      try {
        const response = await queryOllama(text);
        // Remove thinking bubble
        thinkingEl.remove();
        addMessage(response, 'bot');
        isProcessing = false;
        speakResponse(response);
      } catch (err) {
        thinkingEl.remove();
        isProcessing = false;
        const errorMsg = err.message.includes('Failed to fetch')
          ? 'Cannot reach Ollama. Make sure it\'s running on localhost:11434'
          : 'Something went wrong: ' + err.message;
        addMessage(errorMsg, 'bot');
        setStatus('error — check ollama', '');
      }
    }

    // ─── Ollama API ───
    async function queryOllama(prompt) {
      const systemPrompt = `You are Penny, a friendly and concise AI assistant. Keep responses short (2-3 sentences max) and conversational. Be warm and helpful. Do not use markdown formatting, emojis, or special characters. Speak naturally as if in a real conversation.

CRITICAL LANGUAGE RULE: When the user writes in Nepali (even in Roman script), you MUST reply ONLY in Devanagari script. NEVER write romanized Nepali.

Examples:
User: timro nam k ho → Reply: मेरो नाम पेनी हो। म एउटा मित्रवत AI सहायक हुँ।
User: kasto cha → Reply: म ठिक छु, धन्यवाद! तिमीलाई कसरी मद्दत गर्न सक्छु?
User: mero sathi lai advice deu → Reply: तिम्रो साथीलाई भन्नु, सधैं आफ्नो मनको कुरा खुलेर राख्नु पर्छ।

NEVER write like this: "Mero naam Penny ho" — this is WRONG.
ALWAYS write like this: "मेरो नाम पेनी हो" — this is CORRECT.`;

      const res = await fetch(OLLAMA_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: MODEL,
          messages: [
            { role: 'system', content: systemPrompt },
            { role: 'user', content: prompt }
          ],
          think: false,
          stream: false,
          options: {
            temperature: 0.7,
            num_predict: 256
          }
        })
      });

      if (!res.ok) {
        throw new Error(`Ollama returned ${res.status}`);
      }

      const data = await res.json();
      // Clean up the response
      let response = (data.message && data.message.content) || 'I didn\'t quite get that.';
      // Remove <think>...</think> blocks if still present
      response = response.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
      // Remove any leftover XML-like tags
      response = response.replace(/<[^>]+>/g, '').trim();
      // Remove excessive whitespace
      response = response.replace(/\s+/g, ' ').trim();
      return response || 'I didn\'t quite get that.';
    }

    // ─── Text to Speech (Hybrid: Browser native for EN, Edge TTS for Nepali) ───
    const synthesis = window.speechSynthesis;

    // Detect Nepali — Devanagari script OR common romanized Nepali words
    function hasNepali(text) {
      // Check for Devanagari characters
      if (/[\u0900-\u097F]/.test(text)) return true;
      // Fallback: detect romanized Nepali by common words
      const lower = text.toLowerCase();
      const nepaliWords = ['mero', 'timro', 'naam', 'kasto', 'cha', 'chha', 'haina',
        'huncha', 'gardai', 'garna', 'bhayo', 'garnu', 'malai', 'timilai',
        'tapailai', 'hajur', 'dhanyabad', 'namaste', 'namaskar', 'ramro',
        'ho', 'hoina', 'ke', 'kina', 'kata', 'kahile', 'kasari', 'ko',
        'lai', 'sathi', 'didi', 'bhai', 'daju', 'bahini', 'ama', 'baba',
        'paisa', 'rupiya', 'nepal', 'nepali', 'hola', 'parcha', 'bhannu',
        'aaja', 'bholi', 'hijo', 'dinchu', 'khana', 'pani', 'ghar'];
      const words = lower.split(/\s+/);
      const matches = words.filter(w => nepaliWords.includes(w.replace(/[.,!?]/g, '')));
      return matches.length >= 2;
    }

    function speakResponse(text) {
      if (hasNepali(text)) {
        speakWithEdgeTTS(text);
      } else {
        speakWithBrowser(text);
      }
    }

    // ── Fast browser TTS for English ──
    function speakWithBrowser(text) {
      synthesis.cancel();
      isSpeaking = true;
      mouth.classList.add('talking');
      face.classList.add('happy');
      setStatus('speaking...', 'speaking');

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.0;
      utterance.pitch = 1.0;

      const voices = synthesis.getVoices();
      const preferred = voices.find(v => v.name.includes('Google') && v.lang.startsWith('en'))
        || voices.find(v => v.lang.startsWith('en-US'))
        || voices.find(v => v.lang.startsWith('en'));
      if (preferred) utterance.voice = preferred;

      utterance.onend = () => stopSpeaking();
      utterance.onerror = () => stopSpeaking();
      synthesis.speak(utterance);
    }

    // ── Edge TTS for Nepali (proper pronunciation) ──
    let currentAudio = null;
    async function speakWithEdgeTTS(text) {
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }

      isSpeaking = true;
      mouth.classList.add('talking');
      face.classList.add('happy');
      setStatus('speaking (nepali)...', 'speaking');

      try {
        const lang = hasNepali(text) ? 'ne' : 'en';
        const res = await fetch('/api/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, lang })
        });
        if (!res.ok) throw new Error('TTS failed');

        const audioBlob = await res.blob();
        const audioUrl = URL.createObjectURL(audioBlob);
        const audio = new Audio(audioUrl);
        currentAudio = audio;

        audio.onended = () => { stopSpeaking(); URL.revokeObjectURL(audioUrl); currentAudio = null; };
        audio.onerror = () => { stopSpeaking(); URL.revokeObjectURL(audioUrl); currentAudio = null; };
        await audio.play();
      } catch (err) {
        console.error('Edge TTS error:', err);
        // Fallback to browser TTS
        speakWithBrowser(text);
      }
    }

    function stopSpeaking() {
      isSpeaking = false;
      mouth.classList.remove('talking');
      face.classList.remove('happy');
      setStatus('tap the mic or type to talk', '');
    }

    // Preload voices
    synthesis.onvoiceschanged = () => synthesis.getVoices();

    // ─── Chat UI ───
    function addMessage(text, sender, isThinking = false) {
      const msg = document.createElement('div');
      msg.className = `message ${sender}`;

      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = sender === 'user' ? 'You' : 'Penny';
      msg.appendChild(label);

      const content = document.createElement('div');
      if (isThinking) {
        content.className = 'typing-dots';
        content.textContent = '...';
      } else {
        content.textContent = text;
      }
      msg.appendChild(content);

      chatMessages.appendChild(msg);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      return msg;
    }

    function setStatus(text, type) {
      statusText.textContent = text;
      statusText.className = 'status' + (type ? ` ${type}` : '');
    }
  </script>

</body>

</html>
